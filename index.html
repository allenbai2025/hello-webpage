<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A simple hello webpage created with WorkBuddy">
  <title>Hello · allenbai2025</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1f2937;
      --muted: #6b7280;
      --line: #e5e7eb;
      --accent: #2563eb;
      --bg: #f5f7fb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(circle at 20% 15%, #e0e7ff 0, transparent 45%),
                  radial-gradient(circle at 85% 85%, #dbeafe 0, transparent 40%),
                  var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC",
                   "Microsoft JhengHei", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
    }
    main {
      width: min(100%, 620px);
      padding: 48px 40px;
      text-align: center;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: 0 18px 50px rgba(31, 41, 55, 0.08);
    }
    h1 {
      margin: 0 0 8px;
      font-size: clamp(2.2rem, 7vw, 3.4rem);
      letter-spacing: -0.03em;
    }
    h1 span { color: var(--accent); }
    .zh { margin: 0 0 24px; font-size: 1.15rem; color: var(--muted); }
    p { margin: 0 0 12px; }
    code {
      padding: 2px 7px;
      background: #f3f4f6;
      border-radius: 6px;
      font-size: 0.9em;
    }
    footer {
      margin-top: 32px;
      padding-top: 20px;
      border-top: 1px solid var(--line);
      font-size: 0.85rem;
      color: var(--muted);
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main>
    <h1>Hello, <span>World</span>!</h1>
    <p class="zh">你好，世界！</p>
    <p>這個頁面由 WorkBuddy 建立，並推送到</p>
    <p><code>github.com/allenbai2025/hello-webpage</code></p>
    <footer>
      Built with WorkBuddy · <a href="https://github.com/allenbai2025" target="_blank" rel="noopener">@allenbai2025</a>
    </footer>
  </main>
</body>
</html>
